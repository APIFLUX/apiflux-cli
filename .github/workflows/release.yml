name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      # Both publishes skip already-released versions so a re-run after a
      # partial failure stays idempotent.
      - name: Publish apiflux-cli
        run: |
          ver=$(node -p "require('./package.json').version")
          if npm view "apiflux-cli@$ver" version >/dev/null 2>&1; then
            echo "apiflux-cli@$ver already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @apiflux/cli alias
        working-directory: scoped
        run: |
          ver=$(node -p "require('./package.json').version")
          if npm view "@apiflux/cli@$ver" version >/dev/null 2>&1; then
            echo "@apiflux/cli@$ver already published, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
